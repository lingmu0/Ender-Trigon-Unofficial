plugins {
    id 'net.fabricmc.fabric-loom' version '1.16.3'
    id 'maven-publish'
}
version = project.mod_version
group = 'net.xuwu'
base { archivesName = "${mod_id}-${minecraft_version}-fabric" }
repositories { mavenCentral() }
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
}
sourceSets.main.resources.srcDir 'src/generated/resources'
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}
java { toolchain.languageVersion = JavaLanguageVersion.of(25); withSourcesJar() }
jar { from('LICENSE'); from('NOTICE') }



// Verify injection points against Minecraft bytecode without starting a game.
sourceSets {
    audit {
        java.srcDir 'tools'
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.compileClasspath
    }
}
class AuditArguments implements CommandLineArgumentProvider {
    @Classpath FileCollection targets
    Iterable<String> asArguments() { targets.files.collect { it.absolutePath } }
}
tasks.register('verifyMixins', JavaExec) {
    dependsOn classes, auditClasses
    classpath = sourceSets.audit.runtimeClasspath
    mainClass = 'MixinAudit'
    argumentProviders.add(new AuditArguments(targets: sourceSets.main.output.classesDirs + sourceSets.main.compileClasspath))
}
tasks.named('check') { dependsOn 'verifyMixins' }
